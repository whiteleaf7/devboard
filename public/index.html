<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<script src="/theme.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>devboard</title>
<link rel="stylesheet" href="/board.css">
<!-- テーマはどれも :root[data-theme="<id>"] の下に閉じているので、全部読んでおき、theme.js が選んだものだけが効く -->
<link rel="stylesheet" href="/themes/business.css">
<link rel="stylesheet" href="/themes/poster.css">
<link rel="stylesheet" href="/themes/poster-light.css">
<link rel="stylesheet" href="/themes/terminal.css">
<link rel="stylesheet" href="/themes/paper.css">
<link rel="stylesheet" href="/themes/pop.css">
<link rel="stylesheet" href="/themes/tategaki.css">
<link rel="stylesheet" href="/themes/motion.css">
<style>
  /* 幅が狭いときの並べ方。テーマの指定より後に置いて、どのテーマでも 1 段にする（縦書きは横に流れるので除く） */
  @media (max-width: 1100px) {
    :root:not([data-theme="tategaki"]) main { grid-template-columns: minmax(0, 1fr); }
    :root:not([data-theme="tategaki"]) .alert-list { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    :root:not([data-theme="tategaki"]) main { padding: 20px 16px 110px; gap: 36px; }
    :root:not([data-theme="tategaki"]) .top { flex-wrap: wrap; gap: 10px 16px; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); }
    :root:not([data-theme="tategaki"]) .stats { padding-left: 16px; padding-right: 16px; }
    :root:not([data-theme="tategaki"]) .errors { margin: 12px 16px 0; }
    /* 一覧の列の最小幅や、階段状のずらし・斜めの札が、狭い画面の幅を超えないようにする */
    :root:not([data-theme="tategaki"]) .cleared, :root:not([data-theme="tategaki"]) .files { grid-template-columns: minmax(0, 1fr); }
    :root:not([data-theme="tategaki"]) .queue { padding-right: 10px; }
    :root:not([data-theme="tategaki"]) .queue li { margin-left: 0; }
    dialog { width: 100vw; max-width: 100vw; max-height: 92dvh; margin: auto 0 0; border-radius: 12px 12px 0 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    #task, #settings { width: 100vw; }
    .view-head button { min-height: 40px; }
    .view-title { font-size: var(--fs-xl); }
  }
</style>
</head>
<body>
<div class="bg"><i></i></div>
<div class="page" id="page">
  <header class="top">
    <h1 class="logo" id="logo">devboard</h1>
    <nav class="pages" aria-label="画面"><a href="/" aria-current="page">ボード</a><a href="/activity">活動</a></nav>
    <div class="branch" id="branch"></div>
    <span class="spacer"></span>
    <div class="live" id="live" title="変更を監視中">LIVE</div>
    <div class="clock" id="clock"></div>
    <button type="button" class="top-button" id="open-settings">設定</button>
  </header>
  <div class="errors" id="errors"></div>
  <div class="stats" id="stats"></div>
  <main>
    <section>
      <h2 class="h red"><b>NOW</b><small>進行中</small></h2>
      <div class="now-list" id="now"></div>
    </section>
    <aside>
      <h2 class="h"><b>NEXT</b><small>次にやる順</small></h2>
      <ol class="queue" id="queue"></ol>
      <div id="queue-pager"></div>
    </aside>
    <section>
      <h2 class="h red"><b>ALERT</b><small>確認待ち・止まっている</small></h2>
      <div class="alert-list" id="alerts"></div>
    </section>
    <aside>
      <h2 class="h"><b>MILESTONE</b><small>マイルストーン</small></h2>
      <div class="ms-list" id="milestones" role="group" aria-label="マイルストーンで絞り込む"></div>
    </aside>
    <section class="span">
      <h2 class="h"><b>CLEARED</b><small>終わったもの</small><span class="n" id="cleared-n"></span></h2>
      <div class="cleared" id="cleared"></div>
      <div id="cleared-pager"></div>
    </section>
    <section class="span">
      <h2 class="h red"><b>DECISION</b><small>決定記録</small></h2>
      <div class="files" id="files"></div>
      <div id="files-pager"></div>
    </section>
  </main>
</div>
<footer class="ticker"><div class="tag">COMMIT</div><div class="track" id="ticker"></div></footer>
<div class="cutin" id="cutin" aria-live="polite"><div class="band"><span class="word"></span><span class="what" id="cutin-what"></span></div></div>

<dialog id="detail" aria-labelledby="detail-title">
  <form method="dialog" class="close"><button class="secondary" autofocus>閉じる</button></form>
  <h3 id="detail-title"></h3>
  <div class="md" id="detail-body"></div>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="settings">
    <h3 id="settings-title" style="margin: 0 0 12px">設定</h3>
    <fieldset id="theme-options">
      <legend>テーマ</legend>
    </fieldset>
    <fieldset>
      <legend>文字の大きさ</legend>
      <label><input type="radio" name="font-size" value="small"> 小さい</label>
      <label><input type="radio" name="font-size" value="normal"> 標準</label>
      <label><input type="radio" name="font-size" value="large"> 大きい</label>
      <label><input type="radio" name="font-size" value="xlarge"> とても大きい</label>
    </fieldset>
    <div class="settings-actions"><button class="secondary">閉じる</button></div>
  </form>
</dialog>
<dialog id="task" aria-labelledby="view-title">
  <article id="task-view">
    <div class="view-head">
      <span class="id" id="view-id"></span>
      <span id="view-status"></span>
      <span id="view-priority"></span>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="view-close">閉じる</button>
    </div>
    <h3 class="view-title" id="view-title"></h3>
    <dl class="props" id="view-props"></dl>
    <section class="view-section">
      <h4>説明</h4>
      <div class="md" id="view-description"></div>
    </section>
    <section class="view-section" id="view-notes-section">
      <h4>メモ</h4>
      <div id="view-notes"></div>
    </section>
  </article>
</dialog>
<script type="module">
import { parseMarkdown } from "./markdown.js";
import { nextLimit, page } from "./paging.js";

const STATUS_LABEL = { todo: "未着手", doing: "作業中", review: "確認待ち", blocked: "ブロック", done: "完了", cancelled: "中止" };
const LIST_SIZE = { queue: { first: 8, step: 20 }, cleared: { first: 10, step: 30 }, files: { first: 8, step: 20 } };
const PRIORITY_RANK = { high: 0, normal: 1, low: 2 };
const FINISHED = ["done", "cancelled"];
// カードに出す最新メモの長さ。全文はタスクを開けば読める
const NOTE_MAX = 140;
// マイルストーンの目盛りは、終わったものから順に並べる
const SEG_ORDER = ["done", "review", "doing", "blocked", "todo"];
// マイルストーンは目立たせない。目標の文はカードに出さず、乗せたときの説明（title）にだけ出す
// マイルストーンの目盛りのコマの数の上限。タスクが多いと、コマの枠と隙間だけで列の幅を超えるので、何件かずつまとめる
const SEG_MAX = 24;
const WEEKDAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const CUTIN_MS = 2600;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of children) node.append(c);
  return node;
};
const fmt = (iso) => new Date(iso).toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "short" });
const ago = (iso) => {
  const d = new Date(iso);
  const sec = (Date.now() - d.getTime()) / 1000;
  if (sec < 60) return "たった今";
  if (sec < 3600) return `${Math.floor(sec / 60)}分前`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}時間前`;
  if (sec < 86400 * 7) return `${Math.floor(sec / 86400)}日前`;
  return d.toLocaleDateString("ja-JP", d.getFullYear() === new Date().getFullYear() ? { month: "numeric", day: "numeric" } : { dateStyle: "short" });
};
const timeAgo = (iso) => {
  const node = el("time", { className: "ago", dateTime: iso, textContent: ago(iso), title: `更新 ${fmt(iso)}` });
  node.dataset.at = iso;
  return node;
};
// 経過時間と時計は、描き直しを待たずに進める
setInterval(() => { for (const t of document.querySelectorAll("time.ago[data-at]")) t.textContent = ago(t.dataset.at); }, 30_000);
function tickClock() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  $("clock").replaceChildren(`${pad(d.getHours())}:${pad(d.getMinutes())}`, el("small", { textContent: `${d.getMonth() + 1}.${d.getDate()} ${WEEKDAYS[d.getDay()]}` }));
}
tickClock();
setInterval(tickClock, 15_000);

// ---- 設定 ----
$("theme-options").append(...THEMES.map((t) => {
  const input = el("input", { type: "radio", name: "theme", value: t.id });
  input.onchange = () => { localStorage.setItem(THEME_KEY, t.id); applyTheme(t.id); replayEntrance = true; if (data) render(); };
  return el("label", {}, input, ` ${t.label}`, el("small", { textContent: t.scheme === "dark" ? "暗い" : "明るい" }));
}));
$("open-settings").onclick = () => {
  for (const r of document.querySelectorAll('#settings input[name="theme"]')) r.checked = r.value === document.documentElement.dataset.theme;
  for (const r of document.querySelectorAll('#settings input[name="font-size"]')) r.checked = r.value === storedFontSize();
  $("settings").showModal();
};
for (const r of document.querySelectorAll('#settings input[name="font-size"]')) {
  r.onchange = () => { localStorage.setItem(FONT_SIZE_KEY, r.value); applyFontSize(r.value); };
}
// ほかの画面でテーマを変えたら、描き直して入ってくる動きも新しいテーマにする
addEventListener("storage", (e) => { if (e.key === THEME_KEY && data) { replayEntrance = true; render(); } });

let data = null;
let filter = null; // 選択中のマイルストーン ID
const SHOW_DONE_MILESTONES_KEY = "devboard-show-done-milestones";
let showDoneMilestones = localStorage.getItem(SHOW_DONE_MILESTONES_KEY) === "true";
const limits = new Map(); // 一覧ごとに開いた件数。変更の通知で描き直しても保つ

// 一覧やカードに入れるため、Markdown を記号のない 1 行の文にする
const inlineText = (items) => items.map((n) => (n.type === "text" || n.type === "code" ? n.text : inlineText(n.children))).join("");
const blockText = (b) => {
  switch (b.type) {
    case "heading": return inlineText(b.content);
    case "paragraph": return b.lines.map(inlineText).join(" ");
    case "list": return b.items.map((item) => item.map(blockText).join(" ")).join(" / ");
    case "quote": return b.children.map(blockText).join(" ");
    case "code": return b.text;
    default: return "";
  }
};
const plainText = (md) => parseMarkdown(md).map(blockText).filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
const clip = (text, max) => (text.length > max ? `${text.slice(0, max)}…` : text);
const lastNote = (t) => clip(plainText(t.notes.at(-1)?.text ?? ""), NOTE_MAX);

// このタスクを依存先に挙げているタスク（終わったものも含む）
const dependentsOf = (id) => data.tasks.filter((t) => t.dependsOn.includes(id));

const inlineNodes = (items) => items.map((n) => {
  switch (n.type) {
    case "text": return n.text;
    case "code": return el("code", { textContent: n.text });
    case "strong": return el("strong", {}, ...inlineNodes(n.children));
    case "link": return el("a", { href: n.href, target: "_blank", rel: "noreferrer" }, ...inlineNodes(n.children));
  }
});
const blockNode = (b) => {
  switch (b.type) {
    // ダイアログの見出しが h3 なので、本文の見出しはその下の段にする
    case "heading": return el(`h${Math.min(b.level + 3, 6)}`, {}, ...inlineNodes(b.content));
    case "paragraph": return el("p", {}, ...b.lines.flatMap((line, i) => [...(i ? [el("br")] : []), ...inlineNodes(line)]));
    case "list": return el(b.ordered ? "ol" : "ul", {}, ...b.items.map((item) => el("li", {}, ...item.map(blockNode))));
    case "quote": return el("blockquote", {}, ...b.children.map(blockNode));
    case "code": return el("pre", {}, el("code", { textContent: b.text }));
    case "rule": return el("hr");
  }
};
const markdownNodes = (text) => parseMarkdown(text).map(blockNode);

function openDetail(title, body) {
  $("detail-title").textContent = title;
  // 決定記録の本文は 1 行目がタイトルの見出しなので、ダイアログの見出しと重ねない
  const blocks = parseMarkdown(body);
  if (blocks[0]?.type === "heading" && blocks[0].level === 1) blocks.shift();
  $("detail-body").replaceChildren(...blocks.map(blockNode));
  $("detail").showModal();
  $("detail").scrollTop = 0;
}

// ---- タスクの詳細 ----
const statusColor = (status) => `--c: var(--st-${status === "cancelled" ? "todo" : status})`;
const taskDialog = $("task");
let viewing = null; // 開いているタスクの ID

function noteNode(n) {
  return el("div", { className: "note" },
    el("time", {}, fmt(n.at), el("span", { className: "by", textContent: n.by === "user" ? "あなた" : n.by === "ai" ? "AI" : "" })),
    el("div", { className: "md" }, ...markdownNodes(n.text)));
}

function taskLink(id) {
  const t = data.tasks.find((x) => x.id === id);
  if (!t) return el("span", { className: "task-link" }, el("span", { className: "id", textContent: id }), "（見つからない）");
  const link = el("button", { type: "button", className: "task-link" },
    el("span", { className: "id", textContent: t.id }),
    el("span", { className: "name", textContent: t.title }),
    el("span", { className: "status-badge", style: statusColor(t.status), textContent: STATUS_LABEL[t.status] }));
  link.onclick = () => showTask(t.id);
  return link;
}

function renderTaskView(task) {
  const milestone = data.project.milestones.find((m) => m.id === task.milestone);
  $("view-id").textContent = task.id;
  $("view-status").replaceChildren(el("span", { className: "status-badge", style: statusColor(task.status), textContent: STATUS_LABEL[task.status] }));
  $("view-priority").replaceChildren(...(task.priority === "normal" ? [] : [el("span", { className: `tag ${task.priority}`, textContent: task.priority === "high" ? "優先" : "低い優先度" })]));
  $("view-title").textContent = task.title;
  const props = [
    ["マイルストーン", task.milestone && [milestone ? `${milestone.id} ${milestone.title}` : task.milestone]],
    ["親タスク", task.parent && [taskLink(task.parent)]],
    ["依存", task.dependsOn.length && task.dependsOn.map(taskLink), "stack"],
    ["待っているタスク", dependentsOf(task.id).map((t) => taskLink(t.id)), "stack"],
    ["子タスク", task.children.length && task.children.map(taskLink), "stack"],
    ["ラベル", task.labels.length && task.labels.map((l) => el("span", { className: "tag", textContent: l }))],
    ["ブランチ", task.branch && [el("code", { textContent: task.branch })]],
    ["触る範囲", task.paths.length && task.paths.map((p) => el("code", { textContent: p })), "stack"],
    ["登録", [`${task.createdBy === "user" ? "あなた" : "AI"} · ${fmt(task.created)}`]],
    ["更新", [fmt(task.updated)]],
  ];
  $("view-props").replaceChildren(...props.filter(([, value]) => value && value.length !== 0).flatMap(([label, value, className = ""]) =>
    [el("dt", { textContent: label }), el("dd", { className }, ...value)]));
  $("view-description").replaceChildren(...(task.description.trim()
    ? markdownNodes(task.description)
    : [el("p", { className: "empty", textContent: "説明なし" })]));
  $("view-notes").replaceChildren(...task.notes.slice().reverse().map(noteNode));
  $("view-notes-section").hidden = task.notes.length === 0;
}

function showTask(id) {
  const task = data.tasks.find((t) => t.id === id);
  if (!task) return taskDialog.close();
  viewing = id;
  renderTaskView(task);
  if (!taskDialog.open) taskDialog.showModal();
  taskDialog.scrollTop = 0;
  $("view-close").focus();
}

$("view-close").onclick = () => taskDialog.close();
taskDialog.addEventListener("close", () => { viewing = null; });

// バックドロップのクリックで閉じる。押した位置と離した位置がどちらも外側のときに限り、
// 本文の文字を選択していてポインタが外に出たときには閉じない
for (const dialog of document.querySelectorAll("dialog")) {
  const onBackdrop = (e) => {
    const r = dialog.getBoundingClientRect();
    return e.target === dialog && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom);
  };
  let pressedOnBackdrop = false;
  dialog.addEventListener("pointerdown", (e) => { pressedOnBackdrop = onBackdrop(e); });
  dialog.addEventListener("click", (e) => {
    if (pressedOnBackdrop && onBackdrop(e)) dialog.close();
  });
}

// ---- 一覧の省略 ----
function pagedList(key, items) {
  return page(items, limits.get(key) ?? LIST_SIZE[key].first);
}

// 省略した一覧の下に置く「さらに表示」と「たたむ」
function pager(key, { shown, rest }) {
  const size = LIST_SIZE[key];
  const button = (label, onclick) => el("button", { type: "button", textContent: label, onclick });
  const buttons = [
    ...(rest ? [button(`さらに表示（残り ${rest} 件）`, () => { limits.set(key, nextLimit(shown.length, size.step, shown.length + rest)); render(); })] : []),
    ...(shown.length > size.first ? [button("たたむ", () => { limits.delete(key); render(); })] : []),
  ];
  return buttons.length ? [el("div", { className: "pager" }, ...buttons)] : [];
}

// ---- 関係するタスクの浮き札 ----
// カードにマウスを乗せると、つながるタスクのカードに印を付け、カードの下にその一覧を出す。
// 印を付けるカードが「さらに表示」の先にあっても、一覧のほうで分かる
const HOVER_LIST_MAX = 6;
let hovered = null; // マウスを乗せているタスクの ID。描き直しても保つ
const hoverCard = el("div", { className: "hovercard", role: "tooltip", hidden: true });
document.body.append(hoverCard);
const hideHoverCard = () => { hoverCard.hidden = true; };
addEventListener("scroll", hideHoverCard, { passive: true });
$("page").addEventListener("scroll", hideHoverCard, { passive: true });

const relationsOf = (t) => [
  ["親タスク", t.parent ? [t.parent] : []],
  ["子タスク", t.children],
  ["依存", t.dependsOn],
  ["待っているタスク", dependentsOf(t.id).map((d) => d.id)],
].filter(([, ids]) => ids.length);

function hoverItem(id) {
  const t = data.tasks.find((x) => x.id === id);
  return el("div", { className: "item", style: statusColor(t?.status ?? "todo") },
    el("span", { className: "id", textContent: id }),
    el("span", { className: "name", textContent: t ? t.title : "（見つからない）" }),
    ...(t ? [el("span", { className: "st", textContent: STATUS_LABEL[t.status] })] : []));
}

function markRelated() {
  for (const n of document.querySelectorAll("main .related")) n.classList.remove("related");
  hoverCard.hidden = true;
  const t = hovered && data.tasks.find((x) => x.id === hovered);
  const card = t && document.querySelector(`main [data-id="${t.id}"]`);
  const relations = t ? relationsOf(t) : [];
  if (!card || !relations.length) return;
  const ids = new Set(relations.flatMap(([, ids]) => ids));
  for (const n of document.querySelectorAll("main [data-id]")) if (ids.has(n.dataset.id)) n.classList.add("related");

  hoverCard.replaceChildren(...relations.map(([label, ids]) => el("section", {},
    el("h5", { textContent: `${label}${ids.length > 1 ? ` ${ids.length}` : ""}` }),
    ...ids.slice(0, HOVER_LIST_MAX).map(hoverItem),
    ...(ids.length > HOVER_LIST_MAX ? [el("div", { className: "more", textContent: `ほか ${ids.length - HOVER_LIST_MAX} 件` })] : []))));
  hoverCard.hidden = false;
  // カードの下に出す。下に入りきらなければ上に出す
  const r = card.getBoundingClientRect();
  const { width, height } = hoverCard.getBoundingClientRect();
  hoverCard.style.left = `${Math.max(8, Math.min(r.left, innerWidth - width - 8))}px`;
  hoverCard.style.top = `${r.bottom + 6 + height <= innerHeight ? r.bottom + 6 : Math.max(8, r.top - height - 6)}px`;
}

function hover(id) {
  hovered = id;
  markRelated();
}

// タスクのカードを開けるようにし、マウスを乗せたらつながるタスクを出す
function asTask(node, t) {
  node.dataset.id = t.id;
  node.tabIndex = 0;
  node.setAttribute("role", "button");
  node.onclick = () => { hover(null); showTask(t.id); };
  node.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hover(null); showTask(t.id); } };
  node.onmouseenter = (e) => { if (e.buttons === 0) hover(t.id); };
  node.onmouseleave = () => hover(null);
  return node;
}

// マイルストーンの目盛り。タスクは終わったものから順に並んでいる。SEG_MAX 件までは 1 件 1 コマ、
// それより多ければ SEG_MAX コマに等分し、全部終わったコマは done、作業中か確認待ちを含むコマは doing にする
function segments(tasks) {
  const count = Math.min(tasks.length, SEG_MAX);
  return Array.from({ length: count }, (_, i) => {
    const part = tasks.slice(Math.floor((i * tasks.length) / count), Math.floor(((i + 1) * tasks.length) / count));
    const className = part.every((t) => t.status === "done") ? "done" : part.some((t) => ["doing", "review"].includes(t.status)) ? "doing" : "";
    return el("i", { className, title: part.length === 1 ? `${part[0].id} ${part[0].title}` : `${part[0].id}〜${part.at(-1).id}（${part.length} 件）` });
  });
}

// ---- 描画 ----
// 入ってくる動き（.rise）は、開いた直後・テーマを変えたとき・新しく現れたカードだけに出す。
// 変更の通知のたびに描き直すので、前からあるカードは動きを先送りして終えた形で置き、続けて揺れる動きだけを残す
let seen = new Set(); // 前に描いたカードの鍵
let nextSeen = new Set();
let replayEntrance = false;
const enter = (node, key) => {
  if (seen.has(key) && !replayEntrance) node.style.animationDelay = "-60s";
  nextSeen.add(key);
  return node;
};
const chip = (text, className = "", title = "") => el("span", { className: `chip ${className}`.trim(), textContent: text, title });
const none = (text) => el("div", { className: "none", textContent: text });

function render() {
  const { project, tasks, decisions, git, errors } = data;
  nextSeen = new Set();
  document.title = `${project.name} devboard`;
  $("logo").replaceChildren(...[...project.name.toUpperCase()].map((c, i) => el("span", { textContent: c, style: `--k:${i}` })));
  $("logo").setAttribute("aria-label", project.name);
  $("branch").hidden = !git.branch;
  $("branch").replaceChildren(el("span", { textContent: git.branch ?? "" }), ...(git.dirty ? [el("em", { textContent: `未コミット ${git.dirty}` })] : []));
  $("errors").textContent = errors.join("\n");

  const byId = new Map(tasks.map((t) => [t.id, t]));
  const isFinished = (id) => FINISHED.includes(byId.get(id)?.status);
  // 終わっていない依存先として自分を待っている、終わっていないタスク
  const waiters = new Map();
  for (const t of tasks) {
    if (FINISHED.includes(t.status)) continue;
    for (const w of t.waitingOn) waiters.set(w.id, [...(waiters.get(w.id) ?? []), t.id]);
  }
  const of = (status) => tasks.filter((t) => t.status === status);
  const shown = filter ? tasks.filter((t) => t.milestone === filter) : tasks;
  const shownOf = (status) => shown.filter((t) => t.status === status)
    .sort((a, b) => PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || b.updated.localeCompare(a.updated));
  const crumb = (t) => {
    if (!t.parent) return [];
    const parent = byId.get(t.parent);
    return [el("span", { className: "crumb", textContent: `${parent ? parent.title : t.parent} ›`, title: `親タスク ${t.parent}` })];
  };
  // タスクの札。子タスクの数は、進行中のカードでは目盛り（kids）で出すので札にしない
  const chipsOf = (t, { kids = false, time = false } = {}) => {
    const blocking = waiters.get(t.id) ?? [];
    const doneKids = t.children.filter(isFinished).length;
    return el("span", { className: "chips" },
      ...(t.priority === "high" ? [chip("優先", "solid")] : []),
      ...(t.milestone && !filter ? [chip(t.milestone)] : []),
      ...t.labels.map((l) => chip(l)),
      ...(t.waitingOn.length ? [chip(`待ち ${t.waitingOn.map((w) => w.id).join(", ")}`, "solid")] : []),
      ...(blocking.length ? [chip(blocking.length === 1 ? `止めている ${blocking[0]}` : `止めている ${blocking.length} 件`, "", blocking.join(", "))] : []),
      ...(t.children.length && !kids ? [chip(`子 ${doneKids}/${t.children.length}`)] : []),
      ...(t.closable ? [chip("閉じられる", "", "子タスクがすべて終わっている")] : []),
      ...(time ? [el("span", { className: "chip" }, timeAgo(t.updated))] : []));
  };

  // 数の帯。絞り込みによらず、ボード全体の数
  const live = tasks.filter((t) => t.status !== "cancelled");
  const stat = (className, d, value, label) => enter(el("div", { className: `stat ${className} rise`, style: `--d:${d}` }, el("b", { textContent: value }), el("span", { textContent: label })), `stat:${label}`);
  $("stats").replaceChildren(
    stat("hot", 0, of("doing").length, "進行中"),
    stat("warn", 1, of("review").length + of("blocked").length, "見てほしい"),
    stat("", 2, of("todo").length, "残り"),
    stat("dim", 3, `${of("done").length}/${live.length}`, "完了"),
  );

  // 進行中
  const doing = shownOf("doing");
  $("now").replaceChildren(...(doing.length ? doing.map((t, i) => {
    const note = lastNote(t);
    return asTask(enter(el("article", { className: "op rise", style: `--d:${i + 2}` },
      el("div", { className: "face" },
        el("span", { className: "bigid", textContent: t.id.replace(/^T-/, "") }),
        el("div", {},
          el("span", { className: "stamp", textContent: t.id }),
          chipsOf(t, { kids: true }),
          ...(t.children.length ? [el("span", { className: "kids", title: `子タスク ${t.children.filter(isFinished).length}/${t.children.length}` },
            ...t.children.map((id) => el("i", { className: isFinished(id) ? "on" : "" })))] : [])),
        el("h3", {}, ...crumb(t), t.title),
        ...(note ? [el("div", { className: "bubble", textContent: note })] : []),
        el("div", { className: "foot" }, ...(t.branch ? [el("span", { className: "br", textContent: t.branch })] : []), timeAgo(t.updated)))), `now:${t.id}`), t);
  }) : [none("作業中のタスクはない")]));

  // マイルストーン。押すと、その中のタスクだけに絞り込む
  const doneMilestones = project.milestones.filter((m) => m.status === "done").length;
  const listed = project.milestones.filter((m) => showDoneMilestones || m.status !== "done");
  const msNodes = listed.map((m, i) => {
    // 中止したタスクは、進み具合の分母に入れない
    const mine = tasks.filter((t) => t.milestone === m.id && t.status !== "cancelled")
      .sort((a, b) => SEG_ORDER.indexOf(a.status) - SEG_ORDER.indexOf(b.status));
    const done = mine.filter((t) => t.status === "done").length;
    const pct = mine.length ? Math.round((done / mine.length) * 100) : 0;
    const node = el("div", { className: `ms ${m.status} rise`, style: `--d:${i + 3}`, tabIndex: 0, role: "button",
      title: `${m.id} ${m.title}（${done}/${mine.length}）${m.goal ? `\n${m.goal}` : ""}` },
      el("div", { className: "row1" },
        el("span", { className: "mid", textContent: m.id }),
        el("span", { className: "title", textContent: m.title }),
        el("span", { className: "state", textContent: { planned: "予定", active: "進行中", done: "完了" }[m.status] }),
        el("span", { className: "pct" }, String(pct), el("small", { textContent: "%" }))),
      el("div", { className: "segs" }, ...segments(mine)));
    enter(node, `ms:${m.id}`);
    node.setAttribute("aria-pressed", String(filter === m.id));
    const toggle = () => { filter = filter === m.id ? null : m.id; render(); };
    node.onclick = toggle;
    node.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    return node;
  });
  const toggleDone = el("button", { type: "button", className: "ms-more",
    textContent: showDoneMilestones ? "完了を隠す" : `完了 ${doneMilestones}`, title: showDoneMilestones ? "" : `完了したマイルストーン ${doneMilestones} 件も出す` });
  toggleDone.setAttribute("aria-pressed", String(showDoneMilestones));
  toggleDone.onclick = () => {
    showDoneMilestones = !showDoneMilestones;
    localStorage.setItem(SHOW_DONE_MILESTONES_KEY, String(showDoneMilestones));
    if (!showDoneMilestones && project.milestones.find((m) => m.id === filter)?.status === "done") filter = null;
    render();
  };
  $("milestones").replaceChildren(...(msNodes.length ? msNodes : [none("マイルストーンはない")]), ...(doneMilestones ? [toggleDone] : []));

  // 確認待ち・止まっている
  const reviewCard = (t, i) => {
    const note = lastNote(t);
    return asTask(enter(el("article", { className: "check rise", style: `--d:${i + 4}` },
      el("span", { className: "seal" }),
      el("div", { className: "label" }),
      el("div", { className: "card-id", textContent: t.id }),
      el("div", { className: "card-title" }, ...crumb(t), t.title),
      ...(note ? [el("div", { className: "reason", textContent: note })] : []),
      chipsOf(t, { time: true })), `alert:${t.id}`), t);
  };
  const blockedCard = (t, i) => {
    const reason = t.stuck ? `進められない: ${t.stuck}` : lastNote(t);
    return asTask(enter(el("article", { className: "hazard rise", style: `--d:${i + 5}` },
      el("div", { className: "face" },
        el("div", { className: "label" }),
        el("div", { className: "card-id", textContent: t.id }),
        el("div", { className: "card-title" }, ...crumb(t), t.title),
        ...(reason ? [el("div", { className: "reason", textContent: reason })] : []),
        chipsOf(t, { time: true }))), `alert:${t.id}`), t);
  };
  const alerts = [...shownOf("review").map(reviewCard), ...shownOf("blocked").map(blockedCard)];
  $("alerts").replaceChildren(...(alerts.length ? alerts : [none("確認待ちも止まっているタスクもない")]));

  // 次にやる順。並べられないもの（子を持つ親や、進められないもの）は後ろに ID 順で置く
  const todo = shown.filter((t) => t.status === "todo")
    .sort((a, b) => (a.order ?? Infinity) - (b.order ?? Infinity) || a.id.localeCompare(b.id));
  const pagedTodo = pagedList("queue", todo);
  $("queue").replaceChildren(...pagedTodo.shown.map((t, i) => {
    const meta = [
      t.id,
      ...(t.milestone && !filter ? [t.milestone] : []),
      ...t.labels,
      ...(t.stuck ? [`進められない: ${t.stuck}`] : t.waitingOn.length ? [`待ち ${t.waitingOn.map((w) => w.id).join(", ")}`] : []),
    ].join(" · ");
    const first = i === 0 && t.order != null;
    return asTask(enter(el("li", { className: `rise${first ? " first" : ""}${t.priority === "low" ? " low" : ""}`, style: `--i:${Math.min(i, 8)}; --d:${i + 5}` },
      el("span", { className: "num", textContent: t.order ?? "–", title: t.order == null ? "並べられない（子を持つか、進められない）" : "着手する順" }),
      el("div", { className: "plate" }, el("span", { className: "t" }, ...crumb(t), t.title), el("span", { className: "m", textContent: meta })),
      t.priority === "high" ? el("span", { className: "burst", textContent: "優先" }) : el("span")), `queue:${t.id}`), t);
  }));
  if (!todo.length) $("queue").replaceChildren(el("li", { className: "none", textContent: "未着手のタスクはない" }));
  $("queue-pager").replaceChildren(...pager("queue", pagedTodo));

  // 終わったもの。新しい順
  const finished = shown.filter((t) => FINISHED.includes(t.status)).sort((a, b) => b.updated.localeCompare(a.updated));
  const pagedFinished = pagedList("cleared", finished);
  $("cleared-n").textContent = `×${shown.filter((t) => t.status === "done").length}`;
  $("cleared").replaceChildren(...(finished.length ? pagedFinished.shown.map((t, i) => asTask(enter(el("article", { className: `tile ${t.status} rise`, style: `--d:${Math.min(i, 12) + 6}` },
    el("div", { className: "card-id", textContent: [t.id, ...(t.milestone && !filter ? [t.milestone] : [])].join("  ") }),
    el("div", { className: "tt", textContent: t.title }),
    timeAgo(t.updated),
    el("span", { className: "seal" })), `cleared:${t.id}`), t)) : [none("まだない")]));
  $("cleared-pager").replaceChildren(...pager("cleared", pagedFinished));

  // 決定記録。新しい順
  const pagedFiles = pagedList("files", decisions.slice().reverse());
  $("files").replaceChildren(...(decisions.length ? pagedFiles.shown.map((d, i) => {
    const node = enter(el("article", { className: "file rise", style: `--d:${Math.min(i, 8) + 8}`, tabIndex: 0, role: "button" },
      el("span", { className: "no", textContent: `No.${String(d.number).padStart(4, "0")}` }),
      el("div", { className: "ft", textContent: d.title }),
      el("div", { className: "fm" }, chip(d.status, d.status === "採用" ? "solid" : ""), el("span", { textContent: d.date }))), `file:${d.number}`);
    node.onclick = () => openDetail(d.title, d.body);
    node.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(d.title, d.body); } };
    return node;
  }) : [none("なし")]));
  $("files-pager").replaceChildren(...pager("files", pagedFiles));

  // 下を流れるコミット。途切れないよう 2 回並べ、2 回目は読み上げない
  const commit = (c) => el("span", { title: c.date }, el("b", { textContent: c.hash }), c.subject);
  const commits = git.commits.map(commit);
  $("ticker").replaceChildren(...(commits.length
    ? [...commits, ...git.commits.map((c) => Object.assign(commit(c), { className: "dup", ariaHidden: "true" }))]
    : [el("span", { textContent: "コミットなし" })]));

  seen = nextSeen;
  replayEntrance = false;

  // AI の更新で描き直しても、マウスを乗せているカードの印と一覧を消さない
  if (hovered) markRelated();
  // 表示中のタスクを AI が更新したら、開いたまま中身を差し替える
  const viewed = tasks.find((t) => t.id === viewing);
  if (viewed) renderTaskView(viewed);
}

// ---- 終わったときの演出 ----
// 変更の通知で、前に見たときは終わっていなかったタスクが完了になったら出す。開いた直後の読み込みでは出さない
let lastStatus = null;
const cutinQueue = [];
let cutinPlaying = false;
function playCutin() {
  if (cutinPlaying || !cutinQueue.length) return;
  cutinPlaying = true;
  const t = cutinQueue.shift();
  $("cutin-what").replaceChildren(el("b", { textContent: t.id }), t.title);
  const c = $("cutin");
  c.classList.remove("show");
  void c.offsetWidth; // 続けて出すとき、動きを最初からやり直す
  c.classList.add("show");
  setTimeout(() => { c.classList.remove("show"); cutinPlaying = false; playCutin(); }, CUTIN_MS);
}
function celebrate(tasks) {
  if (lastStatus) {
    for (const t of tasks) if (t.status === "done" && lastStatus.has(t.id) && lastStatus.get(t.id) !== "done") cutinQueue.push(t);
    playCutin();
  }
  lastStatus = new Map(tasks.map((t) => [t.id, t.status]));
}

// 無重力: マウスの位置で画面を傾ける（-1〜1）
addEventListener("mousemove", (e) => {
  if (document.documentElement.dataset.theme !== "motion") return;
  const root = document.documentElement.style;
  root.setProperty("--mx", (e.clientX / innerWidth * 2 - 1).toFixed(3));
  root.setProperty("--my", (e.clientY / innerHeight * 2 - 1).toFixed(3));
});
// 縦書き: 本文は横に流れるので、縦のホイールを横の送りに変える（下へ回すと左へ進む）
addEventListener("wheel", (e) => {
  if (document.documentElement.dataset.theme !== "tategaki" || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  if (e.target.closest?.("dialog")) return;
  e.preventDefault();
  $("page").scrollBy({ left: -e.deltaY });
}, { passive: false });

// 活動の画面の図から ?task=T-NNN で来たら、そのタスクを開く
let requestedTask = new URLSearchParams(location.search).get("task");

async function load() {
  const res = await fetch("/api/snapshot");
  data = await res.json();
  render();
  celebrate(data.tasks);
  if (requestedTask) {
    showTask(requestedTask);
    requestedTask = null;
    history.replaceState(null, "", "/");
  }
}

function listen() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("live").classList.add("on"); load(); };
  es.addEventListener("change", load);
  es.onerror = () => $("live").classList.remove("on");
}

load();
listen();
</script>
</body>
</html>
