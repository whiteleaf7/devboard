<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<script src="/theme.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>devboard</title>
<link rel="stylesheet" href="/base.css">
<style>
  .task-head { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .task-head h2 { margin: 0; flex: none; }
  .milestones { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .ms { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: 12px; color: inherit; cursor: pointer; white-space: nowrap; }
  .ms::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); flex: none; }
  .ms .name { max-width: 16em; overflow: hidden; text-overflow: ellipsis; }
  .ms .bar { width: 32px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; flex: none; }
  .ms .bar i { display: block; height: 100%; background: var(--done); }
  .ms .count { color: var(--sub); font-variant-numeric: tabular-nums; }
  .ms[aria-pressed="true"] { border-color: var(--doing); box-shadow: inset 0 0 0 1px var(--doing); }
  .ms.more { color: var(--sub); }
  .ms.more::before { display: none; }

  .groups { display: grid; gap: 10px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .group > summary { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; user-select: none; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▶"; color: var(--sub); font-size: 9px; width: 10px; text-align: center; transition: transform 0.15s; }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group > summary .sq { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .group > summary .n { color: var(--sub); font-weight: normal; }
  /* 空のグループは枠を付けず、見出しの 1 行だけにして場所を取らない */
  .group.empty { background: none; border-color: transparent; }
  .group.empty > summary { color: var(--sub); cursor: default; padding-block: 0; }
  .group.empty > summary::before { visibility: hidden; }
  .group .pager { margin: 0; padding: 6px 12px 8px; border-top: 1px solid var(--line); }

  .row { display: grid; grid-template-columns: 18px 5.4em minmax(10em, 1fr) auto 4.6em; grid-template-areas: "mark id title tags ago" ". . note note note"; align-items: baseline; gap: 2px 10px; padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; transition: opacity 0.12s; }
  .row:hover { background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .row:focus-visible { outline: 2px solid var(--doing); outline-offset: -2px; }
  .row .mark { grid-area: mark; justify-self: center; font-family: ui-monospace, monospace; font-size: 11px; color: var(--sub); }
  .row .mark.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); align-self: center; }
  .row .meta { display: contents; }
  .row .id { grid-area: id; font-family: ui-monospace, monospace; font-size: 12px; color: var(--sub); }
  .row .title { grid-area: title; overflow-wrap: anywhere; line-height: 1.5; }
  .row .crumb { display: inline-block; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; color: var(--sub); font-size: 12px; margin-right: 4px; }
  .row .tags { grid-area: tags; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 26em; min-width: 0; }
  .row .ago { grid-area: ago; text-align: right; color: var(--sub); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .note-line { grid-area: note; color: var(--sub); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .row.cancelled { opacity: 0.55; }
  .row.cancelled .title { text-decoration: line-through; }
  /* マウスを乗せた行とつながるタスクの行。ほかの行は薄くしない（動かすたびに一覧全体がちらつくため） */
  .row.related { background: color-mix(in srgb, var(--doing) 7%, transparent); box-shadow: inset 3px 0 0 var(--doing); }
  .hovercard { position: fixed; z-index: 10; width: max-content; max-width: min(480px, 90vw); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.14); padding: 8px 12px 10px; font-size: 12px; pointer-events: none; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .hovercard section { min-width: 0; }
  .hovercard h5 { margin: 0 0 3px; font-size: 11px; color: var(--sub); font-weight: 600; }
  .hovercard .item { display: flex; align-items: baseline; gap: 6px; min-width: 0; line-height: 1.6; }
  .hovercard .item::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c); align-self: center; }
  .hovercard .id { flex: none; font-family: ui-monospace, monospace; color: var(--sub); }
  .hovercard .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hovercard .st { flex: none; color: var(--c); }
  .hovercard .more { color: var(--sub); padding-left: 12px; }
  .tag.high { color: var(--blocked); border-color: var(--blocked); }
  .tag.wait { color: var(--review); border-color: var(--review); }
  .tag.blocking { color: var(--doing); border-color: var(--doing); }
  .tag.closable { color: var(--done); border-color: var(--done); }

  .decisions { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .decisions button { display: flex; gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .decisions button:first-child { border-top: 0; }
  .decisions .num { font-family: ui-monospace, monospace; color: var(--sub); }
  .decisions .title { flex: 1; }
  .decisions .date { color: var(--sub); font-size: 12px; }

  .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
  .pager button { font-size: 12px; color: var(--sub); white-space: nowrap; }

  .commits { font-family: ui-monospace, monospace; font-size: 12px; color: var(--sub); margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }

  dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: min(720px, 92vw); max-height: 84vh; padding: 20px 24px; }
  dialog::backdrop { background: rgb(0 0 0 / 0.3); }
  dialog .close { float: right; }

  .md { line-height: 1.7; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 1.4em; }
  .md li > p { margin: 0; }
  .md li > ul, .md li > ol { margin: 2px 0 0; }
  .md h4, .md h5, .md h6 { margin: 20px 0 6px; font-size: 14px; }
  .md h4 { font-size: 15px; }
  .md code { font-family: ui-monospace, monospace; font-size: 0.9em; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin: 0 0 10px; overflow-x: auto; line-height: 1.5; }
  .md pre code { background: none; border: 0; padding: 0; }
  .md blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--sub); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .md a { color: var(--doing); }

  #task { width: min(760px, 92vw); }
  .view-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .view-head .spacer { flex: 1; }
  .view-head .id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--sub); }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
  .status-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .view-title { font-size: 20px; line-height: 1.4; margin: 10px 0 16px; overflow-wrap: anywhere; }
  .props { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 20px; font-size: 13px; }
  .props dt { color: var(--sub); }
  .props dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
  .props dd.stack { display: grid; gap: 4px; }
  .task-link { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; line-height: 1.7; }
  .task-link > * + * { margin-left: 6px; }
  .task-link .name { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
  .task-link:hover .name { text-decoration-color: currentColor; }
  .task-link .id, .props code { font-family: ui-monospace, monospace; font-size: 12px; color: var(--sub); }
  .view-section { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
  .view-section h4 { font-size: 12px; color: var(--sub); font-weight: 600; margin: 0 0 8px; }
  .note { margin: 0 0 14px; }
  .note time { color: var(--sub); font-size: 12px; display: block; margin-bottom: 2px; }

  .note .by { font-size: 11px; margin-left: 6px; }

  #settings { width: min(360px, 92vw); }
  #settings fieldset { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px 12px; margin: 0; display: grid; gap: 8px; }
  #settings legend { font-size: 12px; color: var(--sub); padding: 0 4px; }
  #settings label { display: flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; }
  .settings-actions { display: flex; justify-content: flex-end; margin-top: 16px; }

  /* スマホ: 行は「タイトル」「ID・タグ・時刻」「最新メモ」の段に分け、ダイアログは画面いっぱいにする */
  @media (max-width: 760px) {
    .task-head { flex-wrap: nowrap; }
    .milestones { flex-wrap: nowrap; overflow-x: auto; margin-right: -16px; padding: 2px 16px 2px 0; scrollbar-width: none; }
    .milestones::-webkit-scrollbar { display: none; }

    .row { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "mark title title" ". meta ago" ". note note"; padding: 9px 12px; gap: 3px 8px; }
    .row .title { font-size: 15px; }
    .row .meta { grid-area: meta; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; min-width: 0; }
    .row .tags { display: contents; }
    /* ブランチ名は長く、スマホでは詳細で見れば足りる */
    .row .tag.branch { display: none; }
    .row .mark { align-self: start; margin-top: 5px; }
    .row .mark.dot { align-self: start; margin-top: 7px; }

    .decisions button { flex-wrap: wrap; gap: 4px 10px; padding: 10px 12px; }
    .decisions .title { flex-basis: calc(100% - 60px); }
    .decisions .tag { margin-left: 46px; }
    .commits li { overflow-wrap: anywhere; }

    dialog { width: 100vw; max-width: 100vw; max-height: 92dvh; margin: auto 0 0; border-radius: 12px 12px 0 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    #task, #settings { width: 100vw; }
    .view-head button { min-height: 40px; }
    .view-title { font-size: 18px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="name">devboard</h1>
  <nav class="pages" aria-label="画面"><a href="/" aria-current="page">ボード</a><a href="/activity">活動</a></nav>
  <span class="spacer"></span>
  <span class="git" id="git"></span>
  <button type="button" class="secondary" id="open-settings">設定</button>
  <span class="live" id="live" title="変更を監視中"></span>
</header>
<main>
  <div class="errors" id="errors"></div>
  <section>
    <div class="task-head">
      <h2>タスク</h2>
      <div class="milestones" id="milestones" role="group" aria-label="マイルストーンで絞り込む"></div>
    </div>
    <div class="groups" id="board"></div>
  </section>
  <section>
    <h2>決定記録</h2>
    <div class="decisions" id="decisions"></div>
    <div id="decisions-pager"></div>
  </section>
  <section>
    <h2>最近のコミット</h2>
    <ul class="commits" id="commits"></ul>
  </section>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <form method="dialog" class="close"><button class="secondary" autofocus>閉じる</button></form>
  <h3 id="detail-title"></h3>
  <div class="md" id="detail-body"></div>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="settings">
    <h3 id="settings-title" style="margin: 0 0 12px">設定</h3>
    <fieldset>
      <legend>テーマ</legend>
      <label><input type="radio" name="theme" value="light"> ライト</label>
      <label><input type="radio" name="theme" value="dark"> ダーク</label>
    </fieldset>
    <div class="settings-actions"><button class="secondary">閉じる</button></div>
  </form>
</dialog>
<dialog id="task" aria-labelledby="view-title">
  <article id="task-view">
    <div class="view-head">
      <span class="id" id="view-id"></span>
      <span id="view-status"></span>
      <span id="view-priority"></span>
      <span class="spacer"></span>
      <button type="button" class="secondary" id="view-close">閉じる</button>
    </div>
    <h3 class="view-title" id="view-title"></h3>
    <dl class="props" id="view-props"></dl>
    <section class="view-section">
      <h4>説明</h4>
      <div class="md" id="view-description"></div>
    </section>
    <section class="view-section" id="view-notes-section">
      <h4>メモ</h4>
      <div id="view-notes"></div>
    </section>
  </article>
</dialog>
<script type="module">
import { parseMarkdown } from "./markdown.js";
import { nextLimit, page } from "./paging.js";

// 上から、眺めたい順・手を出す順に並べる
const GROUPS = [
  ["doing", "作業中"], ["review", "確認待ち"], ["blocked", "ブロック"], ["todo", "未着手"], ["done", "完了・中止"],
];
const STATUS_LABEL = { todo: "未着手", doing: "作業中", review: "確認待ち", blocked: "ブロック", done: "完了", cancelled: "中止" };
const LIST_SIZE = { group: { first: 10, step: 30 }, decisions: { first: 5, step: 20 } };
const PRIORITY_RANK = { high: 0, normal: 1, low: 2 };
// 最新メモを 2 行目に出す状態。動いているか、あなたの手を待っているもの
const SHOW_NOTE = ["doing", "review", "blocked"];
document.getElementById("open-settings").onclick = () => {
  for (const r of document.querySelectorAll('#settings input[name="theme"]')) r.checked = r.value === document.documentElement.dataset.theme;
  document.getElementById("settings").showModal();
};
for (const r of document.querySelectorAll('#settings input[name="theme"]')) {
  r.onchange = () => { localStorage.setItem(THEME_KEY, r.value); applyTheme(r.value); };
}

let data = null;
let filter = null; // 選択中のマイルストーン ID
const SHOW_DONE_MILESTONES_KEY = "devboard-show-done-milestones";
let showDoneMilestones = localStorage.getItem(SHOW_DONE_MILESTONES_KEY) === "true";
const OPEN_GROUPS_KEY = "devboard-open-groups";
// グループごとの開閉。覚えていないものは、完了・中止だけたたむ
const openGroups = (() => { try { return JSON.parse(localStorage.getItem(OPEN_GROUPS_KEY) ?? "{}"); } catch { return {}; } })();
const isOpen = (status) => openGroups[status] ?? status !== "done";
const limits = new Map(); // 一覧（グループの状態か "decisions"）ごとに開いた件数。変更の通知で描き直しても保つ

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of children) node.append(c);
  return node;
};
const fmt = (iso) => new Date(iso).toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "short" });
const ago = (iso) => {
  const d = new Date(iso);
  const sec = (Date.now() - d.getTime()) / 1000;
  if (sec < 60) return "たった今";
  if (sec < 3600) return `${Math.floor(sec / 60)}分前`;
  if (sec < 86400) return `${Math.floor(sec / 3600)}時間前`;
  if (sec < 86400 * 7) return `${Math.floor(sec / 86400)}日前`;
  return d.toLocaleDateString("ja-JP", d.getFullYear() === new Date().getFullYear() ? { month: "numeric", day: "numeric" } : { dateStyle: "short" });
};
// 経過時間の表示は、描き直しを待たずに進める
setInterval(() => { for (const t of document.querySelectorAll("time.ago[data-at]")) t.textContent = ago(t.dataset.at); }, 30_000);

// 一覧の 2 行目に入れるため、Markdown を記号のない 1 行の文にする
const inlineText = (items) => items.map((n) => (n.type === "text" || n.type === "code" ? n.text : inlineText(n.children))).join("");
const blockText = (b) => {
  switch (b.type) {
    case "heading": return inlineText(b.content);
    case "paragraph": return b.lines.map(inlineText).join(" ");
    case "list": return b.items.map((item) => item.map(blockText).join(" ")).join(" / ");
    case "quote": return b.children.map(blockText).join(" ");
    case "code": return b.text;
    default: return "";
  }
};
const plainText = (md) => parseMarkdown(md).map(blockText).filter(Boolean).join(" ").replace(/\s+/g, " ").trim();

const FINISHED = ["done", "cancelled"];
// このタスクを依存先に挙げているタスク（終わったものも含む）
const dependentsOf = (id) => data.tasks.filter((t) => t.dependsOn.includes(id));

const inlineNodes = (items) => items.map((n) => {
  switch (n.type) {
    case "text": return n.text;
    case "code": return el("code", { textContent: n.text });
    case "strong": return el("strong", {}, ...inlineNodes(n.children));
    case "link": return el("a", { href: n.href, target: "_blank", rel: "noreferrer" }, ...inlineNodes(n.children));
  }
});
const blockNode = (b) => {
  switch (b.type) {
    // ダイアログの見出しが h3 なので、本文の見出しはその下の段にする
    case "heading": return el(`h${Math.min(b.level + 3, 6)}`, {}, ...inlineNodes(b.content));
    case "paragraph": return el("p", {}, ...b.lines.flatMap((line, i) => [...(i ? [el("br")] : []), ...inlineNodes(line)]));
    case "list": return el(b.ordered ? "ol" : "ul", {}, ...b.items.map((item) => el("li", {}, ...item.map(blockNode))));
    case "quote": return el("blockquote", {}, ...b.children.map(blockNode));
    case "code": return el("pre", {}, el("code", { textContent: b.text }));
    case "rule": return el("hr");
  }
};
const markdownNodes = (text) => parseMarkdown(text).map(blockNode);

function openDetail(title, body) {
  $("detail-title").textContent = title;
  // 決定記録の本文は 1 行目がタイトルの見出しなので、ダイアログの見出しと重ねない
  const blocks = parseMarkdown(body);
  if (blocks[0]?.type === "heading" && blocks[0].level === 1) blocks.shift();
  $("detail-body").replaceChildren(...blocks.map(blockNode));
  $("detail").showModal();
  $("detail").scrollTop = 0;
}

const statusColor = (status) => `--c: var(--${status === "cancelled" ? "todo" : status})`;
const taskDialog = $("task");
let viewing = null; // 開いているタスクの ID

function noteNode(n) {
  return el("div", { className: "note" },
    el("time", {}, fmt(n.at), el("span", { className: "by", textContent: n.by === "user" ? "あなた" : n.by === "ai" ? "AI" : "" })),
    el("div", { className: "md" }, ...markdownNodes(n.text)));
}

function taskLink(id) {
  const t = data.tasks.find((x) => x.id === id);
  if (!t) return el("span", { className: "task-link" }, el("span", { className: "id", textContent: id }), "（見つからない）");
  const link = el("button", { type: "button", className: "task-link" },
    el("span", { className: "id", textContent: t.id }),
    el("span", { className: "name", textContent: t.title }),
    el("span", { className: "status-badge", style: statusColor(t.status), textContent: STATUS_LABEL[t.status] }));
  link.onclick = () => showTask(t.id);
  return link;
}

function renderTaskView(task) {
  const milestone = data.project.milestones.find((m) => m.id === task.milestone);
  $("view-id").textContent = task.id;
  $("view-status").replaceChildren(el("span", { className: "status-badge", style: statusColor(task.status), textContent: STATUS_LABEL[task.status] }));
  $("view-priority").replaceChildren(...(task.priority === "normal" ? [] : [el("span", { className: `tag ${task.priority}`, textContent: task.priority === "high" ? "優先" : "低い優先度" })]));
  $("view-title").textContent = task.title;
  const props = [
    ["マイルストーン", task.milestone && [milestone ? `${milestone.id} ${milestone.title}` : task.milestone]],
    ["親タスク", task.parent && [taskLink(task.parent)]],
    ["依存", task.dependsOn.length && task.dependsOn.map(taskLink), "stack"],
    ["待っているタスク", dependentsOf(task.id).map((t) => taskLink(t.id)), "stack"],
    ["子タスク", task.children.length && task.children.map(taskLink), "stack"],
    ["ラベル", task.labels.length && task.labels.map((l) => el("span", { className: "tag", textContent: l }))],
    ["ブランチ", task.branch && [el("code", { textContent: task.branch })]],
    ["触る範囲", task.paths.length && task.paths.map((p) => el("code", { textContent: p })), "stack"],
    ["登録", [`${task.createdBy === "user" ? "あなた" : "AI"} · ${fmt(task.created)}`]],
    ["更新", [fmt(task.updated)]],
  ];
  $("view-props").replaceChildren(...props.filter(([, value]) => value && value.length !== 0).flatMap(([label, value, className = ""]) =>
    [el("dt", { textContent: label }), el("dd", { className }, ...value)]));
  $("view-description").replaceChildren(...(task.description.trim()
    ? markdownNodes(task.description)
    : [el("p", { className: "empty", textContent: "説明なし" })]));
  $("view-notes").replaceChildren(...task.notes.slice().reverse().map(noteNode));
  $("view-notes-section").hidden = task.notes.length === 0;
}

function showTask(id) {
  const task = data.tasks.find((t) => t.id === id);
  if (!task) return taskDialog.close();
  viewing = id;
  renderTaskView(task);
  if (!taskDialog.open) taskDialog.showModal();
  taskDialog.scrollTop = 0;
  $("view-close").focus();
}

$("view-close").onclick = () => taskDialog.close();
taskDialog.addEventListener("close", () => { viewing = null; });

// バックドロップのクリックで閉じる。押した位置と離した位置がどちらも外側のときに限り、
// 本文の文字を選択していてポインタが外に出たときには閉じない
for (const dialog of document.querySelectorAll("dialog")) {
  const onBackdrop = (e) => {
    const r = dialog.getBoundingClientRect();
    return e.target === dialog && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom);
  };
  let pressedOnBackdrop = false;
  dialog.addEventListener("pointerdown", (e) => { pressedOnBackdrop = onBackdrop(e); });
  dialog.addEventListener("click", (e) => {
    if (pressedOnBackdrop && onBackdrop(e)) dialog.close();
  });
}

function pagedList(key, size, items) {
  return page(items, limits.get(key) ?? size.first);
}

// 省略した一覧の下に置く「さらに表示」と「たたむ」
function pager(key, size, { shown, rest }) {
  const button = (label, onclick) => el("button", { type: "button", className: "secondary", textContent: label, onclick });
  const buttons = [
    ...(rest ? [button(`さらに表示（残り ${rest} 件）`, () => { limits.set(key, nextLimit(shown.length, size.step, shown.length + rest)); render(); })] : []),
    ...(shown.length > size.first ? [button("たたむ", () => { limits.delete(key); render(); })] : []),
  ];
  return buttons.length ? [el("div", { className: "pager" }, ...buttons)] : [];
}

// 行にマウスを乗せると、つながるタスクの行に印を付け、行の下にその一覧を出す。
// 印を付ける行が畳んだグループや「さらに表示」の先にあっても、一覧のほうで分かる
const HOVER_LIST_MAX = 6;
let hovered = null; // マウスを乗せているタスクの ID。描き直しても保つ
const hoverCard = el("div", { className: "hovercard", role: "tooltip", hidden: true });
document.body.append(hoverCard);
window.addEventListener("scroll", () => { hoverCard.hidden = true; }, { passive: true });

const relationsOf = (t) => [
  ["親タスク", t.parent ? [t.parent] : []],
  ["子タスク", t.children],
  ["依存", t.dependsOn],
  ["待っているタスク", dependentsOf(t.id).map((d) => d.id)],
].filter(([, ids]) => ids.length);

function hoverItem(id) {
  const t = data.tasks.find((x) => x.id === id);
  return el("div", { className: "item", style: statusColor(t?.status ?? "todo") },
    el("span", { className: "id", textContent: id }),
    el("span", { className: "name", textContent: t ? t.title : "（見つからない）" }),
    ...(t ? [el("span", { className: "st", textContent: STATUS_LABEL[t.status] })] : []));
}

function markRelated() {
  const board = $("board");
  for (const r of board.querySelectorAll(".row.related")) r.classList.remove("related");
  hoverCard.hidden = true;
  const t = hovered && data.tasks.find((x) => x.id === hovered);
  const row = t && board.querySelector(`.row[data-id="${t.id}"]`);
  const relations = t ? relationsOf(t) : [];
  if (!row || !relations.length) return;
  const ids = new Set(relations.flatMap(([, ids]) => ids));
  for (const r of board.querySelectorAll(".row")) if (ids.has(r.dataset.id)) r.classList.add("related");

  hoverCard.replaceChildren(...relations.map(([label, ids]) => el("section", {},
    el("h5", { textContent: `${label}${ids.length > 1 ? ` ${ids.length}` : ""}` }),
    ...ids.slice(0, HOVER_LIST_MAX).map(hoverItem),
    ...(ids.length > HOVER_LIST_MAX ? [el("div", { className: "more", textContent: `ほか ${ids.length - HOVER_LIST_MAX} 件` })] : []))));
  hoverCard.hidden = false;
  // 行の下に出す。下に入りきらなければ上に出す
  const r = row.getBoundingClientRect();
  const left = row.querySelector(".title").getBoundingClientRect().left;
  const { width, height } = hoverCard.getBoundingClientRect();
  hoverCard.style.left = `${Math.max(8, Math.min(left, innerWidth - width - 8))}px`;
  hoverCard.style.top = `${r.bottom + 4 + height <= innerHeight ? r.bottom + 4 : Math.max(8, r.top - height - 4)}px`;
}

function hover(id) {
  hovered = id;
  markRelated();
}

function render() {
  const { project, tasks, decisions, git, errors } = data;
  $("name").textContent = project.name;
  document.title = `${project.name} devboard`;
  $("git").textContent = git.branch ? `${git.branch}${git.dirty ? ` · 未コミット ${git.dirty}` : ""}` : "";
  $("errors").textContent = errors.join("\n");

  const doneMilestones = project.milestones.filter((m) => m.status === "done").length;
  const listed = project.milestones.filter((m) => showDoneMilestones || m.status !== "done");
  const toggleDone = el("button", { type: "button", className: "ms more",
    textContent: showDoneMilestones ? "完了を隠す" : `完了 ${doneMilestones}`, title: showDoneMilestones ? "" : `完了したマイルストーン ${doneMilestones} 件も出す` });
  toggleDone.setAttribute("aria-pressed", String(showDoneMilestones));
  toggleDone.onclick = () => {
    showDoneMilestones = !showDoneMilestones;
    localStorage.setItem(SHOW_DONE_MILESTONES_KEY, String(showDoneMilestones));
    if (!showDoneMilestones && project.milestones.find((m) => m.id === filter)?.status === "done") filter = null;
    render();
  };
  $("milestones").replaceChildren(...listed.map((m) => {
    // 中止したタスクは、進み具合の分母に入れない
    const mine = tasks.filter((t) => t.milestone === m.id && t.status !== "cancelled");
    const done = mine.filter((t) => t.status === "done").length;
    const pct = mine.length ? Math.round((done / mine.length) * 100) : 0;
    const label = { planned: "予定", active: "進行中", done: "完了" }[m.status];
    const node = el("button", { className: "ms", type: "button", style: `--c: var(--${{ planned: "todo", active: "doing", done: "done" }[m.status]})`,
      title: `${m.id} ${m.title}（${label}）${m.goal ? `\n${m.goal}` : ""}` },
      el("span", { className: "name", textContent: `${m.id} ${m.title}` }),
      el("span", { className: "bar" }, el("i", { style: `width:${pct}%` })),
      el("span", { className: "count", textContent: `${done}/${mine.length}` }),
    );
    node.setAttribute("aria-pressed", String(filter === m.id));
    node.onclick = () => { filter = filter === m.id ? null : m.id; render(); };
    return node;
  }), ...(doneMilestones ? [toggleDone] : []));

  const byId = new Map(tasks.map((t) => [t.id, t]));
  const isFinished = (id) => FINISHED.includes(byId.get(id)?.status);
  // 終わっていない依存先として自分を待っている、終わっていないタスク
  const waiters = new Map();
  for (const t of tasks) {
    if (FINISHED.includes(t.status)) continue;
    for (const w of t.waitingOn) waiters.set(w.id, [...(waiters.get(w.id) ?? []), t.id]);
  }
  const board = $("board");
  const tag = (text, className = "", title = "") => el("span", { className: `tag ${className}`.trim(), textContent: text, title });
  const tagsOf = (t) => {
    const done = t.children.filter(isFinished).length;
    const blocking = waiters.get(t.id) ?? [];
    return [
      ...(t.status === "cancelled" ? [tag("中止")] : []),
      ...(t.priority === "high" ? [tag("優先", "high")] : []),
      ...(t.children.length ? [t.closable
        ? tag(`子 ${done}/${t.children.length} · 閉じられる`, "closable", "子タスクがすべて終わっている")
        : tag(`子 ${done}/${t.children.length}`)] : []),
      ...(t.waitingOn.length ? [tag(`待ち ${t.waitingOn.map((w) => w.id).join(", ")}`, "wait")] : []),
      ...(t.stuck ? [tag("進められない", "wait", t.stuck)] : []),
      ...(blocking.length ? [tag(blocking.length === 1 ? `止めている ${blocking[0]}` : `止めている ${blocking.length} 件`, "blocking", blocking.join(", "))] : []),
      ...(t.milestone && !filter ? [tag(t.milestone)] : []),
      ...t.labels.map((l) => tag(l)),
      ...(t.branch ? [tag(t.branch, "branch", t.branch)] : []),
    ];
  };

  const rowOf = (t) => {
    const parent = t.parent && byId.get(t.parent);
    const lastNote = SHOW_NOTE.includes(t.status) ? t.notes.at(-1) : null;
    const noteText = lastNote ? plainText(lastNote.text) : "";
    const row = el("div", { className: `row ${t.status}`, tabIndex: 0, role: "button", style: statusColor(t.status) },
      t.status === "todo" && t.order != null
        ? el("span", { className: "mark", textContent: String(t.order), title: "着手する順" })
        : el("span", { className: "mark dot" }),
      el("span", { className: "meta" },
        el("span", { className: "id", textContent: t.id }),
        el("span", { className: "tags" }, ...tagsOf(t))),
      el("span", { className: "title" },
        ...(t.parent ? [el("span", { className: "crumb", textContent: `${parent ? parent.title : t.parent} ›`, title: `親タスク ${t.parent}` })] : []),
        t.title),
      el("time", { className: "ago", dateTime: t.updated, textContent: ago(t.updated), title: `更新 ${fmt(t.updated)}` }),
      ...(noteText ? [el("div", { className: "note-line", textContent: noteText, title: noteText })] : []),
    );
    row.querySelector("time").dataset.at = t.updated;
    row.dataset.id = t.id;
    row.onclick = () => { hover(null); showTask(t.id); };
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); hover(null); showTask(t.id); } };
    row.onmouseenter = (e) => { if (e.buttons === 0) hover(t.id); };
    row.onmouseleave = () => hover(null);
    return row;
  };

  const shown = filter ? tasks.filter((t) => t.milestone === filter) : tasks;
  const inGroupOf = (status) => (t) => t.status === status || (status === "done" && t.status === "cancelled");
  board.replaceChildren(...GROUPS.map(([status, label]) => {
    // 未着手は着手する順（order）。並べられないもの（子を持つ親や、進められないもの）は後ろに ID 順で置く。
    // 完了・中止は新しい順。ほかは優先のものを先に、新しい順
    const items = shown.filter(inGroupOf(status)).sort((a, b) =>
      status === "todo" ? (a.order ?? Infinity) - (b.order ?? Infinity) || a.id.localeCompare(b.id)
      : status === "done" ? b.updated.localeCompare(a.updated)
      : PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || b.updated.localeCompare(a.updated));
    const summary = el("summary", {}, el("span", { className: "sq" }), label, el("span", { className: "n", textContent: items.length }));
    if (!items.length) {
      // 空のグループは見出しだけ置き、開閉させない
      summary.onclick = (e) => e.preventDefault();
      return el("details", { className: "group empty", style: `--c: var(--${status})` }, summary);
    }
    const paged = pagedList(status, LIST_SIZE.group, items);
    const group = el("details", { className: "group", style: `--c: var(--${status})`, open: isOpen(status) },
      summary, ...paged.shown.map(rowOf), ...pager(status, LIST_SIZE.group, paged));
    group.ontoggle = () => {
      if (group.open === isOpen(status)) return;
      openGroups[status] = group.open;
      localStorage.setItem(OPEN_GROUPS_KEY, JSON.stringify(openGroups));
    };
    return group;
  }));

  const pagedDecisions = pagedList("decisions", LIST_SIZE.decisions, decisions.slice().reverse());
  $("decisions").replaceChildren(...(decisions.length ? pagedDecisions.shown.map((d) => {
    const row = el("button", { type: "button" },
      el("span", { className: "num", textContent: String(d.number).padStart(4, "0") }),
      el("span", { className: "title", textContent: d.title }),
      el("span", { className: "tag", textContent: d.status }),
      el("span", { className: "date", textContent: d.date }),
    );
    row.onclick = () => openDetail(d.title, d.body);
    return row;
  }) : [el("div", { className: "empty", style: "padding: 8px 12px", textContent: "なし" })]));
  $("decisions-pager").replaceChildren(...pager("decisions", LIST_SIZE.decisions, pagedDecisions));

  $("commits").replaceChildren(...(git.commits.length
    ? git.commits.map((c) => el("li", { textContent: `${c.hash} ${c.date} ${c.subject}` }))
    : [el("li", { textContent: "コミットなし" })]));

  // 表示中のタスクを AI が更新したら、開いたまま中身を差し替える
  // AI の更新で描き直しても、マウスを乗せている行の印と一覧を消さない
  if (hovered) markRelated();

  const viewed = tasks.find((t) => t.id === viewing);
  if (viewed) renderTaskView(viewed);
}

// 活動の画面の図から ?task=T-NNN で来たら、そのタスクを開く
let requestedTask = new URLSearchParams(location.search).get("task");

async function load() {
  const res = await fetch("/api/snapshot");
  data = await res.json();
  render();
  if (requestedTask) {
    showTask(requestedTask);
    requestedTask = null;
    history.replaceState(null, "", "/");
  }
}

function listen() {
  const es = new EventSource("/api/events");
  es.onopen = () => { $("live").classList.add("on"); load(); };
  es.addEventListener("change", load);
  es.onerror = () => $("live").classList.remove("on");
}

load();
listen();
</script>
</body>
</html>
